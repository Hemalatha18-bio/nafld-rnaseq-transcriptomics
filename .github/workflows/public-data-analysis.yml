name: Public data analysis

on:
  push:
    branches: [public-data-results]
    paths:
      - .github/workflows/public-data-analysis.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: public-data-results
          persist-credentials: true

      - name: Set up analysis environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          init-shell: bash

      - name: Run complete GSE135251 workflow
        shell: bash -el {0}
        run: |
          snakemake --snakefile workflow/Snakefile --cores 2 --printshellcmds

      - name: Build lightweight reviewed snapshot
        shell: bash -el {0}
        run: |
          mkdir -p results/snapshot figures/snapshot
          cp results/audit/dataset_audit.tsv results/snapshot/
          cp results/audit/analysis_group_counts.tsv results/snapshot/
          cp results/qc/qc_summary.tsv results/snapshot/
          cp results/deseq2/deseq2_summary.tsv results/snapshot/
          cp results/enrichment/go_bp_enrichment_summary.tsv results/snapshot/
          cp figures/qc/library_size_distribution.png figures/snapshot/
          cp figures/qc/pca_log2cpm.png figures/snapshot/
          cp results/deseq2/volcano_deseq2.png figures/snapshot/
          cp results/enrichment/go_bp_enrichment.png figures/snapshot/

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          out = Path('results/snapshot')

          de = pd.read_csv('results/deseq2/deseq2_all_results.tsv', sep='\t')
          de.head(50).to_csv(out / 'top50_deseq2_by_adjusted_p.tsv', sep='\t', index=False)

          sig = pd.read_csv('results/deseq2/deseq2_significant_fdr05_lfc1.tsv', sep='\t')
          sig.head(100).to_csv(out / 'top100_significant_fdr05_abs_lfc1.tsv', sep='\t', index=False)

          go_path = Path('results/enrichment/go_bp_enrichment.tsv')
          if go_path.exists() and go_path.stat().st_size > 0:
              go = pd.read_csv(go_path, sep='\t')
              if not go.empty:
                  sort_col = 'p.adjust' if 'p.adjust' in go.columns else go.columns[0]
                  go.sort_values(sort_col).head(30).to_csv(out / 'top30_go_bp_terms.tsv', sep='\t', index=False)
              else:
                  (out / 'top30_go_bp_terms.tsv').write_text('No GO BP terms passed the configured threshold.\n')
          else:
              (out / 'top30_go_bp_terms.tsv').write_text('No GO BP terms passed the configured threshold.\n')
          PY

          cat > results/snapshot/README.md <<'EOF'
          # Public GSE135251 results snapshot

          This directory contains lightweight outputs generated by the versioned workflow from the public GEO GSE135251 processed RNA-seq counts.

          The full raw download, gene-by-sample count matrix, normalized count matrix, and large intermediate tables are intentionally not committed. They can be regenerated with Snakemake from the public accession.

          The default inferential contrast is NAFLD fibrosis F3-F4 versus F0-F1. Exploratory PCA uses filtered log2-CPM values; differential expression uses raw integer counts with DESeq2 and Benjamini-Hochberg FDR correction.
          EOF

      - name: Upload complete analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: gse135251-analysis-results
          if-no-files-found: error
          retention-days: 30
          path: |
            metadata/sample_metadata.tsv
            results/audit/
            results/qc/
            results/deseq2/deseq2_summary.tsv
            results/deseq2/deseq2_all_results.tsv
            results/deseq2/deseq2_significant_fdr05_lfc1.tsv
            results/enrichment/
            figures/qc/
            results/snapshot/
            figures/snapshot/

      - name: Commit lightweight snapshot to analysis branch
        shell: bash -el {0}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/snapshot figures/snapshot
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "Add public GSE135251 results snapshot [results]"
            git push origin HEAD:public-data-results
          fi
